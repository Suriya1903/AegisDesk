services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aegisdesk-backend
    environment:
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-aegisdesk}
      AEGISDESK_JWT_SECRET: ${AEGISDESK_JWT_SECRET}
      AEGISDESK_JWT_EXPIRE_HOURS: ${AEGISDESK_JWT_EXPIRE_HOURS:-8}
      AEGISDESK_CORS_ORIGINS: ${AEGISDESK_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}
      HF_HOME: /app/.cache/huggingface
    ports:
      - "8000:8000"
    volumes:
      - aegisdesk_hf_cache:/app/.cache/huggingface
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: aegisdesk-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: aegisdesk-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - aegisdesk_prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      backend:
        condition: service_healthy
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: aegisdesk-grafana
    volumes:
      - aegisdesk_grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  aegisdesk_hf_cache:
  aegisdesk_prometheus_data:
  aegisdesk_grafana_data: